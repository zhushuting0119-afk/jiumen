<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: #16130f;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ===== 页面容器 ===== */
.page-wrap {
  max-width: 480px;
  margin: 0 auto;
  position: relative;
}

/* ===== 封面 ===== */
.cover {
  position: relative;
  width: 100%;
  overflow: hidden;
}
.cover img {
  width: 100%;
  display: block;
}
.cover .scroll-hint {
  position: absolute;
  bottom: 4%;
  left: 50%;
  transform: translateX(-50%);
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 2px solid rgba(212, 175, 118, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 2s ease-in-out infinite;
  cursor: pointer;
  background: rgba(22, 19, 15, 0.35);
  backdrop-filter: blur(2px);
}
.cover .scroll-hint svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: #d4af76;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation: bounceDown 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 118, 0.35); }
  50% { box-shadow: 0 0 0 12px rgba(212, 175, 118, 0); }
}
@keyframes bounceDown {
  0%, 100% { transform: translateY(-2px); }
  50% { transform: translateY(3px); }
}

/* ===== 内容区块 ===== */
.section {
  position: relative;
  width: 100%;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.section.visible {
  opacity: 1;
  transform: translateY(0);
}
.section > img.bg {
  width: 100%;
  display: block;
  background: #1c1813;
}

/* ===== 视频热区 ===== */
.video-hotspot {
  position: absolute;
  cursor: pointer;
  border-radius: 6px;
  overflow: hidden;
  background: #000;
}
.video-hotspot video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.video-hotspot .play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  border: 2px solid rgba(255,255,255,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  pointer-events: none;
  z-index: 2;
}
.video-hotspot .play-btn::after {
  content: '';
  display: block;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 9px 0 9px 16px;
  border-color: transparent transparent transparent #fff;
  margin-left: 4px;
}
.video-hotspot.playing .play-btn {
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.6);
}
.video-hotspot:hover .play-btn {
  background: rgba(0,0,0,0.65);
  transform: translate(-50%, -50%) scale(1.08);
}
.video-hotspot.playing:hover .play-btn {
  opacity: 0;
}

/* 暂停指示 */
.video-hotspot .pause-indicator {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2;
  pointer-events: none;
}
.video-hotspot .pause-indicator::before,
.video-hotspot .pause-indicator::after {
  content: '';
  width: 3px;
  height: 10px;
  background: #fff;
  border-radius: 1px;
}
.video-hotspot .pause-indicator::before { margin-right: 3px; }
.video-hotspot.playing .pause-indicator { display: flex; }

/* ===== 底部 ===== */
.footer {
  padding: 40px 20px 60px;
  text-align: center;
  color: rgba(212, 175, 118, 0.5);
  font-size: 12px;
  letter-spacing: 1px;
  background: #16130f;
}
.footer .divider {
  width: 60px;
  height: 1px;
  background: rgba(212, 175, 118, 0.2);
  margin: 0 auto 16px;
}

/* ===== 加载动画 ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

<script>
// ===== 滚动渐入动画 =====
const sections = document.querySelectorAll('.section');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
sections.forEach(s => observer.observe(s));

// ===== 视频点击播放/暂停 =====
const hotspots = document.querySelectorAll('.video-hotspot');
let currentPlaying = null;

hotspots.forEach(spot => {
  const video = spot.querySelector('video');

  spot.addEventListener('click', () => {
    if (video.paused) {
      // 暂停其他正在播放的视频
      if (currentPlaying && currentPlaying !== spot) {
        const otherVideo = currentPlaying.querySelector('video');
        otherVideo.pause();
        currentPlaying.classList.remove('playing');
      }
      // 每次点击均从头播放
      video.currentTime = 0;
      video.play();
      spot.classList.add('playing');
      currentPlaying = spot;
    } else {
      video.pause();
      spot.classList.remove('playing');
      currentPlaying = null;
    }
  });

  // 播放结束后恢复播放按钮并回到起始帧
  video.addEventListener('ended', () => {
    spot.classList.remove('playing');
    currentPlaying = null;
    video.currentTime = 0;
  });
});

// ===== 滚动时自动暂停离屏视频 =====
const videoObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) {
      const video = entry.target.querySelector('video');
      if (video && !video.paused) {
        video.pause();
        entry.target.classList.remove('playing');
        if (currentPlaying === entry.target) currentPlaying = null;
      }
    }
  });
}, { threshold: 0.3 });
hotspots.forEach(spot => videoObserver.observe(spot));
</script>
